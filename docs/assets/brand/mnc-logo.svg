<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <radialGradient id="mnc-coin-face" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#132340"/>
      <stop offset="72%" stop-color="#101D35"/>
      <stop offset="100%" stop-color="#0B1528"/>
    </radialGradient>
    <clipPath id="mnc-flat-base">
      <rect x="0" y="0" width="512" height="353"/>
    </clipPath>
  </defs>

  <!-- Deep Navy Circular Coin Face (#101D35) with Transparent Exterior -->
  <circle cx="256" cy="256" r="248" fill="url(#mnc-coin-face)"/>

  <!-- Gold Double Ring (#D9B66C): Outer Solid Ring + Inner Precision Dashed Ring -->
  <circle
    cx="256"
    cy="256"
    r="227"
    stroke="#D9B66C"
    stroke-width="8.5"
  />
  <circle
    cx="256"
    cy="256"
    r="204.5"
    stroke="#D9B66C"
    stroke-width="3.6"
    stroke-dasharray="7.138 10.708"
  />

  <!-- Central Geometric Double-Layer Letter M (#EAC77B) with Crisp Flat Baseline -->
  <g clip-path="url(#mnc-flat-base)">
    <!-- Primary Outer Geometric M -->
    <path
      d="M 133 372 L 133 162 L 256 279 L 379 162 L 379 372"
      stroke="#EAC77B"
      stroke-width="27"
      stroke-linejoin="round"
      stroke-linecap="butt"
    />
    <!-- Nested Parallel Inner Geometric M -->
    <path
      d="M 169 372 L 169 255 L 256 338 L 343 255 L 343 372"
      stroke="#E2C074"
      stroke-width="8.2"
      stroke-linejoin="round"
      stroke-linecap="butt"
    />
  </g>
</svg>
